<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Forum — Farm to Consumer, One Fair Price</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#182019;
  --ink-soft:#4a544c;
  --paper:#f5f7f1;
  --paper-raised:#ffffff;
  --line:#dfe4d8;
  --green-900:#16301f;
  --green-800:#1f4a2e;
  --green-700:#276139;
  --green-600:#357f49;
  --green-100:#e3ede2;
  --marigold:#e2a33d;
  --marigold-dark:#b97e22;
  --clay:#a6522f;
  --clay-soft:#f1e0d6;
  --wheat:#f6e6b8;
  --danger:#a63a2f;
  --ok:#2f7a4d;
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:22px;
  --shadow: 0 1px 2px rgba(24,32,25,.06), 0 8px 24px rgba(24,32,25,.06);
  --serif: "Fraunces", Georgia, serif;
  --sans: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --heading:#16301f;
  --brand-text:#1f4a2e;
  --topnav-bg:rgba(245,247,241,.92);
}
html[data-theme="dark"]{
  --ink:#eef2ec;
  --ink-soft:#aab6ac;
  --paper:#111a13;
  --paper-raised:#182119;
  --line:#2a352c;
  --green-900:#0d1a10;
  --green-800:#1c3925;
  --green-700:#2f5a3d;
  --green-600:#3f7a52;
  --green-100:#1e2f22;
  --clay-soft:#2c2018;
  --wheat:#3a3218;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  --heading:#dcead6;
  --brand-text:#7fd394;
  --topnav-bg:rgba(13,20,14,.88);
}
*{box-sizing:border-box; transition:background-color .25s ease, border-color .25s ease, color .25s ease;}
html{scroll-behavior:smooth;}
body{
  margin:0; font-family:var(--sans); color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;
}
img{max-width:100%;display:block;}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--marigold); outline-offset:2px;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0; line-height:1.08; letter-spacing:-.01em; color:var(--heading);}
p{margin:0; line-height:1.6; color:var(--ink-soft);}
.container{max-width:1180px; margin:0 auto; padding:0 28px;}
.hide{display:none !important;}

/* ============ APP SHELL ============ */
#app{min-height:100vh; display:flex; flex-direction:column;}

/* Top nav */
.topnav{position:sticky; top:0; z-index:50; background:var(--topnav-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
.topnav-row{display:flex; align-items:center; justify-content:space-between; padding:14px 28px; max-width:1180px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:0;}
.brand-mark{width:36px; height:36px; border-radius:10px; background:var(--green-800); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.brand-mark svg{width:20px; height:20px;}
.brand-name{font-family:var(--serif); font-weight:600; font-size:1.28rem; color:var(--heading);}
.brand-sub{font-size:.68rem; color:var(--ink-soft); margin-top:-2px; letter-spacing:.02em;}

/* ============ HERO ============ */
.hero{padding:76px 0 64px;}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:end;}
.eyebrow-badge{display:inline-flex; align-items:center; gap:8px; background:var(--green-100); color:var(--brand-text); padding:6px 14px; border-radius:999px; font-size:.8rem; font-weight:600; margin-bottom:22px;}
.eyebrow-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--marigold);}
.hero h1{font-size:clamp(2.5rem, 5vw, 4rem); max-width:13ch;}
.hero h1 em{font-style:normal; color:var(--marigold-dark);}
.hero-lede{font-size:1.15rem; max-width:44ch; margin-top:22px;}
.hero-ctas{display:flex; gap:12px; margin-top:32px; flex-wrap:wrap;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 24px; border-radius:999px; font-weight:600; font-size:.95rem; border:1.5px solid transparent; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green-800); color:#fff;}
.btn-primary:hover{background:var(--green-900); box-shadow:var(--shadow);}
.btn-ghost{background:transparent; color:var(--brand-text); border-color:var(--brand-text);}
.btn-ghost:hover{background:var(--green-100);}
.btn-marigold{background:var(--marigold); color:var(--green-900);}
.btn-marigold:hover{background:var(--marigold-dark); color:#fff;}
.btn-sm{padding:9px 16px; font-size:.83rem;}
.btn-block{width:100%; justify-content:center;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.hero-panel{background:var(--green-900); border-radius:var(--radius-l); padding:30px; color:#fff; position:relative; overflow:hidden;}
.hero-panel::before{content:""; position:absolute; inset:0; background:
  radial-gradient(circle at 85% 12%, rgba(226,163,61,.28), transparent 45%);}
.hero-panel-label{font-size:.78rem; color:#b9ccb9; margin-bottom:4px; position:relative;}
.hero-flow{display:flex; flex-direction:column; gap:0; position:relative;}
.flow-step{display:flex; gap:14px; padding:13px 0; border-bottom:1px solid rgba(255,255,255,.12);}
.flow-step:last-child{border-bottom:none; padding-bottom:0;}
.flow-num{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:600; flex-shrink:0;}
.flow-text b{display:block; font-size:.92rem; font-weight:600; color:#fff;}
.flow-text span{font-size:.8rem; color:#c7d6c7;}

/* ============ SECTION WRAPPERS ============ */
section.block{padding:70px 0;}
.block-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:38px; flex-wrap:wrap;}
.block-head h2{font-size:clamp(1.7rem,3vw,2.3rem); max-width:20ch;}
.block-head p{max-width:42ch; margin-top:8px;}
.divider-weave{height:34px; width:100%;}

/* ideals */
.ideals-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
.ideal-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:24px; display:flex; flex-direction:column; gap:14px;}
.ideal-icon{width:40px;height:40px;}
.ideal-card h3{font-size:1.08rem;}
.ideal-card p{font-size:.89rem;}

/* transparency / stats */
.transparency{background:var(--green-900); border-radius:var(--radius-l); padding:44px; color:#fff;}
.transparency .block-head h2, .transparency .block-head p{color:#fff;}
.transparency .block-head p{color:#c7d6c7;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:24px; margin-top:8px;}
.stat b{display:block; font-family:var(--serif); font-size:2.4rem; color:var(--marigold); font-weight:600;}
.stat span{font-size:.85rem; color:#c7d6c7;}
.price-glass{margin-top:38px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:var(--radius-m); padding:22px;}
.price-glass-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.price-glass-head h4{color:#fff; font-size:1rem;}
.price-bar{display:flex; width:100%; height:14px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.1);}
.price-bar span{height:100%;}
.price-legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px;}
.price-legend-item{display:flex; align-items:center; gap:7px; font-size:.78rem; color:#dbe6db;}
.price-legend-item i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* logistics dept */
.logi-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.logi-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px;}
.logi-stat-row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px dashed var(--line); font-size:.9rem;}
.logi-stat-row:last-child{border-bottom:none;}
.logi-stat-row b{color:var(--heading);}
.route-illustration{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
.route-node{width:12px;height:12px;border-radius:50%;background:var(--green-700); flex-shrink:0;}
.route-node.end{background:var(--marigold);}
.route-line{flex:1; height:2px; background:repeating-linear-gradient(90deg,var(--green-700) 0 6px, transparent 6px 12px); margin:0 6px;}

/* farmers near */
.farmer-filter{display:flex; gap:10px; align-items:center; margin-bottom:22px; flex-wrap:wrap;}
select, input[type=text], input[type=number], input[type=tel], input[type=email], input[type=date], textarea{
  font-family:inherit; padding:10px 13px; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--paper-raised); font-size:.9rem; color:var(--ink);
}
select:focus, input:focus, textarea:focus{border-color:var(--green-700);}
.farmers-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
.farmer-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; display:flex; gap:13px;}
.avatar{width:46px;height:46px;border-radius:50%; background:var(--green-100); color:var(--brand-text); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:.95rem; flex-shrink:0;}
.farmer-card h4{font-size:.98rem;}
.farmer-card .meta{font-size:.8rem; color:var(--ink-soft); margin-top:2px;}
.tag{display:inline-block; font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--green-100); color:var(--brand-text); margin-top:8px;}
.tag.gold{background:var(--wheat); color:var(--marigold-dark);}
.tag.clay{background:var(--clay-soft); color:var(--clay);}
.tag.red{background:#fbe1dd; color:var(--danger);}

/* products */
.products-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.product-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden;}
.product-top{padding:18px; border-bottom:1px solid var(--line);}
.product-top h4{font-size:1.02rem; display:flex; justify-content:space-between; align-items:baseline;}
.product-top .hi{font-size:.78rem; color:var(--ink-soft); font-weight:400;}
.price-row{display:flex; justify-content:space-between; padding:9px 18px; font-size:.82rem;}
.price-row span:last-child{font-weight:600; color:var(--heading);}
.product-foot{padding:12px 18px 16px; background:var(--green-100);}
.product-foot .save{font-size:.76rem; color:var(--brand-text); font-weight:600;}

/* customer overview */
.overview-grid{display:grid; grid-template-columns:.9fr 1.1fr; gap:24px;}
.testi-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; margin-bottom:14px;}
.testi-card p{font-size:.92rem; color:var(--ink); font-style:italic;}
.testi-card .who{margin-top:10px; font-size:.78rem; color:var(--ink-soft); font-style:normal;}

/* footer */
footer{background:var(--green-900); color:#dbe6db; margin-top:40px;}
.footer-top{padding:54px 0 34px; border-bottom:1px solid rgba(255,255,255,.12);}
.footer-thanks{max-width:62ch;}
.footer-thanks h3{color:#fff; font-size:1.5rem;}
.footer-thanks p{color:#c7d6c7; margin-top:12px; font-size:.95rem;}
.footer-thanks .sign{margin-top:18px; font-family:var(--serif); font-size:1.05rem; color:var(--marigold);}
.footer-cols{display:grid; grid-template-columns:repeat(4,1fr); gap:24px; padding:38px 0;}
.footer-col h5{color:#fff; font-size:.85rem; margin-bottom:14px; font-weight:600;}
.footer-col a, .footer-col button.linklike{display:block; background:none; border:none; padding:0; text-align:left; color:#b9ccb9; font-size:.85rem; text-decoration:none; margin-bottom:10px; cursor:pointer;}
.footer-col a:hover, .footer-col button.linklike:hover{color:#fff;}
.footer-bottom{display:flex; justify-content:space-between; align-items:center; padding:20px 0; font-size:.78rem; color:#93a893; flex-wrap:wrap; gap:10px;}
.footer-bottom .legal-links{display:flex; gap:16px;}
.footer-bottom button.linklike{background:none;border:none;color:#93a893;font-size:.78rem;cursor:pointer;padding:0;}
.footer-bottom button.linklike:hover{color:#fff;}
.cookie-bar{position:fixed; left:20px; right:20px; bottom:20px; max-width:520px; margin:0 auto; background:var(--green-900); color:#fff; border-radius:var(--radius-m); padding:18px 20px; box-shadow:0 10px 40px rgba(0,0,0,.25); z-index:200; display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
.cookie-bar p{color:#dbe6db; font-size:.83rem; flex:1;}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,20,16,.55); display:flex; align-items:center; justify-content:center; z-index:300; padding:20px;}
.modal-box{background:var(--paper-raised); border-radius:var(--radius-m); max-width:560px; width:100%; max-height:80vh; overflow-y:auto; padding:30px;}
.modal-box h3{margin-bottom:14px;}
.modal-box p, .modal-box li{font-size:.88rem; margin-bottom:10px;}
.modal-close{float:right; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--ink-soft);}

/* ============ DASHBOARD SHELL ============ */
.dash{display:flex; flex:1; min-height:calc(100vh - 68px);}
.dash-sidebar{width:250px; flex-shrink:0; background:var(--green-900); color:#fff; padding:26px 16px; display:flex; flex-direction:column; gap:4px;}
.dash-sidebar .role-head{padding:0 10px 20px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:14px;}
.dash-sidebar .role-head .avatar{background:rgba(255,255,255,.15); color:#fff;}
.dash-sidebar .role-head .who{display:flex; gap:10px; align-items:center;}
.dash-sidebar .role-head h4{color:#fff; font-size:.95rem;}
.dash-sidebar .role-head span{font-size:.76rem; color:#9fb59f;}
.dash-tab-btn{display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; color:#c7d6c7; padding:11px 12px; border-radius:var(--radius-s); font-size:.88rem; cursor:pointer; font-weight:500;}
.dash-tab-btn:hover{background:rgba(255,255,255,.07); color:#fff;}
.dash-tab-btn.active{background:var(--marigold); color:var(--green-900); font-weight:600;}
.dash-main{flex:1; padding:34px 40px; max-width:1080px;}
.dash-main-head{margin-bottom:28px;}
.dash-main-head h2{font-size:1.6rem;}
.dash-main-head p{margin-top:6px;}

.card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px;}
.card + .card{margin-top:16px;}
.card h3{font-size:1.05rem; margin-bottom:16px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:.78rem; font-weight:600; color:var(--ink-soft);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}

table{width:100%; border-collapse:collapse; font-size:.87rem;}
th{text-align:left; padding:10px 12px; background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:.76rem; text-transform:none; border-bottom:1px solid var(--line);}
td{padding:11px 12px; border-bottom:1px solid var(--line); color:var(--ink);}
tr:last-child td{border-bottom:none;}
.status-pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.74rem; font-weight:600;}
.status-pill.ok{background:#e2f1e6; color:var(--ok);}
.status-pill.pending{background:var(--wheat); color:var(--marigold-dark);}
.status-pill.bad{background:#fbe1dd; color:var(--danger);}
.status-pill.info{background:var(--green-100); color:var(--brand-text);}

.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.kpi{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px;}
.kpi b{display:block; font-family:var(--serif); font-size:1.5rem; color:var(--heading);}
.kpi span{font-size:.78rem; color:var(--ink-soft);}

.tabbar{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.tabbar button{background:none; border:none; padding:10px 4px; margin-right:20px; font-size:.88rem; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent;}
.tabbar button.active{color:var(--brand-text); border-bottom-color:var(--brand-text);}

.breakdown{display:flex; flex-direction:column; gap:0;}
.bd-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:.86rem;}
.bd-row.total{border-bottom:none; border-top:1.5px solid var(--ink); padding-top:12px; margin-top:4px; font-weight:700; font-size:.95rem;}
.bd-row span:last-child{font-weight:600;}

.stepper{display:flex; justify-content:space-between; position:relative; margin:30px 0 10px;}
.stepper::before{content:""; position:absolute; top:13px; left:20px; right:20px; height:2px; background:var(--line); z-index:0;}
.step{display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; z-index:1; flex:1;}
.step .dot{width:28px;height:28px;border-radius:50%; background:var(--paper-raised); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.75rem; color:var(--ink-soft); font-weight:700;}
.step.done .dot{background:var(--green-700); border-color:var(--green-700); color:#fff;}
.step.current .dot{background:var(--marigold); border-color:var(--marigold); color:var(--green-900);}
.step span{font-size:.73rem; text-align:center; color:var(--ink-soft); max-width:84px;}
.step.done span, .step.current span{color:var(--ink); font-weight:600;}

/* ============ LANGUAGE SWITCHER ============ */
.lang-switch{position:relative;}
.lang-switch-btn{display:flex; align-items:center; gap:5px; border:1.5px solid var(--line); background:var(--paper-raised); color:var(--ink); padding:7px 12px; border-radius:999px; font-size:.82rem; font-weight:600; cursor:pointer;}
.lang-switch-btn:hover{border-color:var(--brand-text);}
.lang-menu{position:absolute; top:calc(100% + 8px); right:0; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); box-shadow:var(--shadow); min-width:160px; z-index:120; overflow:hidden;}
.lang-menu button{display:block; width:100%; text-align:left; padding:10px 16px; border:none; background:none; color:var(--ink); font-size:.87rem; cursor:pointer;}
.lang-menu button:hover{background:var(--green-100);}
.lang-menu button.active{font-weight:700; color:var(--brand-text);}

/* ============ TRACKING (Delhivery-style checkpoint timeline) ============ */
.track-header{display:flex; flex-wrap:wrap; justify-content:space-between; gap:14px; align-items:flex-start; padding:18px 20px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:22px;}
.track-header .track-id{font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--heading);}
.track-header .track-meta{font-size:.82rem; color:var(--ink-soft); margin-top:4px;}
.track-header .track-right{text-align:right;}
.track-header .track-eta{font-size:.82rem; color:var(--ink-soft); margin-top:6px;}
.track-divider{border:none; border-top:1px solid var(--line); margin:22px 0;}
.track-timeline{border-left:2px solid var(--line); margin-left:15px; padding-left:24px;}
.track-timeline .tl-item{position:relative; padding-bottom:24px;}
.track-timeline .tl-item:last-child{padding-bottom:2px;}
.track-timeline .tl-item::before{content:''; position:absolute; left:-31px; top:3px; width:13px; height:13px; border-radius:50%; background:var(--paper); border:2px solid var(--line);}
.track-timeline .tl-item.done::before{background:var(--green-700); border-color:var(--green-700);}
.track-timeline .tl-item.current::before{background:var(--marigold); border-color:var(--marigold); box-shadow:0 0 0 5px rgba(226,163,61,.2);}
.track-timeline .tl-time{font-size:.76rem; color:var(--ink-soft); font-weight:600; letter-spacing:.02em;}
.track-timeline .tl-title{font-size:.92rem; font-weight:600; margin:2px 0; color:var(--ink);}
.track-timeline .tl-item.upcoming .tl-title{color:var(--ink-soft); font-weight:500;}
.track-timeline .tl-desc{font-size:.82rem; color:var(--ink-soft);}

.route-modes{display:flex; gap:10px; margin-bottom:18px;}
.mode-btn{flex:1; padding:14px; border-radius:var(--radius-m); border:1.5px solid var(--line); background:var(--paper-raised); cursor:pointer; text-align:left;}
.mode-btn.active{border-color:var(--brand-text); background:var(--green-100);}
.mode-btn b{display:block; font-size:.9rem; color:var(--heading);}
.mode-btn span{font-size:.76rem;}

.chip-list{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--paper); border:1px solid var(--line); padding:6px 12px; border-radius:999px; font-size:.8rem;}

.assoc-grid{display:grid; grid-template-columns:220px 1fr; gap:0;}
.assoc-side{background:var(--paper-raised); border-right:1px solid var(--line); padding:6px;}

/* ============ IMMERSIVE TRANSITIONS ============ */
@keyframes pageIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

@keyframes chatPanelIn{ from{opacity:0; transform:translateY(18px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }

@media (prefers-reduced-motion: no-preference){
  main, .dash, .auth-wrap, .auth-denied, .market-locked{ animation: pageIn .5s cubic-bezier(.22,.61,.36,1) both; }

  .card, .ideal-card, .farmer-card, .product-card, .market-card, .testi-card, .kpi, .stat, .logi-card, .assoc-grid{

  .btn:hover{ transform: translateY(-1px); }
  .chat-fab{ transition: transform .22s cubic-bezier(.34,1.56,.64,1), background-color .2s ease; }
  .chat-fab:hover{ transform: scale(1.08) rotate(-4deg); }
  .theme-toggle{ transition: transform .35s cubic-bezier(.34,1.56,.64,1), background-color .2s ease, color .2s ease; }
  .theme-toggle:hover{ transform: rotate(18deg); }
}

</style>

<body>
<div id="app"></div>
<script>
/* =====================================================================
   SMART FORUM — prototype SPA
   All data below is representative/mock content for demo purposes.
   AGMARKNET reference prices are illustrative figures based on typical
   mandi modal-price ranges reported for these commodities in 2026.
===================================================================== */

/* ---------- AGMARKNET reference price data (₹ per quintal, mandi modal price) ---------- */
const CROPS = [
  { id:'tomato',  name:'Tomato',   hi:'टमाटर',  modal:2450, min:1400, max:3500, unit:'kg', img:'🍅' },
  { id:'onion',   name:'Onion',    hi:'प्याज',   modal:3200, min:1600, max:4600, unit:'kg', img:'🧅' },
  { id:'potato',  name:'Potato',   hi:'आलू',    modal:1400, min:900,  max:2000, unit:'kg', img:'🥔' },
  { id:'wheat',   name:'Wheat',    hi:'गेहूं',    modal:2614, min:2350, max:2900, unit:'kg', img:'🌾' },
  { id:'rice',    name:'Rice',     hi:'चावल',   modal:3789, min:3200, max:4300, unit:'kg', img:'🍚' },
  { id:'garlic',  name:'Garlic',   hi:'लहसुन',  modal:7500, min:5500, max:10000,unit:'kg', img:'🧄' },
  { id:'soybean', name:'Soybean',  hi:'सोयाबीन', modal:5740, min:4900, max:6200, unit:'kg', img:'🫘' },
  { id:'maize',   name:'Maize',    hi:'मक्का',   modal:2300, min:1900, max:2600, unit:'kg', img:'🌽' },
];

/* ---------- Product images ----------
   Self-contained (no hotlinked photos) so listings still render with no internet —
   important for a hackathon demo on unreliable venue wifi. */
function cropImg(cropName, size){
  const c = CROPS.find(x=>x.name===cropName);
  const emoji = c ? c.img : '🌿';
  return `<span class="product-img ${size||''}" aria-hidden="true">${emoji}</span>`;
}

/* ---------- Live AGMARKNET integration ----------
   Real Government of India open-data API: "Current Daily Price of Various Commodities
   from Various Markets (Mandi)" — the actual AGMARKNET dataset, resource id below.
   Docs: https://www.data.gov.in/apis/9ef84268-d588-465a-a308-a864a43d0070
   Uses data.gov.in's own publicly documented sample key by default (shared + rate
   limited) — paste a free personal key (from data.gov.in, one-minute signup) below
   for reliable results. If the live call fails for any reason (offline, no key quota
   left, CORS in some browsers, no record for that commodity today) this always falls
   back to the demo reference price already in CROPS — never a broken UI. */
const AGMARKNET_RESOURCE = '9ef84268-d588-465a-a308-a864a43d0070';
const AGMARKNET_DEFAULT_KEY = '579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b';
const AGMARKNET_CACHE_MS = 15 * 60 * 1000;
async function fetchAgmarknetPrice(cropId){
  const crop = CROPS.find(c=>c.id===cropId);
  if (!crop) return;
  const cached = S.agmarknetCache[cropId];
  if (cached && (Date.now()-cached.ts) < AGMARKNET_CACHE_MS){ S.agmarknetStatus[cropId]='live'; render(); return; }
  S.agmarknetStatus[cropId] = 'loading'; render();
  try{
    const key = (S.agmarknetApiKey || AGMARKNET_DEFAULT_KEY).trim();
    const url = `https://api.data.gov.in/resource/${AGMARKNET_RESOURCE}`
      + `?api-key=${encodeURIComponent(key)}&format=json&limit=5&offset=0`
      + `&filters[commodity]=${encodeURIComponent(crop.name)}`
      + `&filters[state]=${encodeURIComponent(S.agmarknetState||'Maharashtra')}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const rec = data && Array.isArray(data.records) ? data.records[0] : null;
    if (!rec || !rec.modal_price) throw new Error('No live record returned for today');
    S.agmarknetCache[cropId] = {
      modal:Number(rec.modal_price), min:Number(rec.min_price), max:Number(rec.max_price),
      market:rec.market, district:rec.district, arrivalDate:rec.arrival_date, ts:Date.now(),
    };
    S.agmarknetStatus[cropId] = 'live';
  }catch(e){
    S.agmarknetStatus[cropId] = 'fallback';
    S.agmarknetError = (e && e.message) || 'Live fetch failed';
  }
  render();
}
function agmarknetBadge(cropName){
  const crop = CROPS.find(c=>c.name===cropName);
  if (!crop) return '';
  const st = S.agmarknetStatus[crop.id];
  const cached = S.agmarknetCache[crop.id];
  if (st==='loading') return `<div class="agm-badge">⏳ ${L('Checking AGMARKNET…','AGMARKNET जांचा जा रहा है…')}</div>`;
  if (st==='live' && cached){
    const per = inr((cached.modal/100).toFixed(2));
    return `<div class="agm-badge live" title="${esc(cached.market||'')}, ${esc(cached.district||'')} · ${L('arrival','आगमन')} ${esc(cached.arrivalDate||'')}">🟢 ${L('Live AGMARKNET','लाइव AGMARKNET')}: ${per}/kg <button class="linklike" style="font-size:.75rem;" data-agmfetch="${crop.id}">${L('refresh','रीफ़्रेश')}</button></div>`;
  }
  if (st==='fallback') return `<div class="agm-badge">🟡 ${L('Live price unavailable — showing demo reference','लाइव कीमत उपलब्ध नहीं — डेमो संदर्भ दिखाया जा रहा है')} · <button class="linklike" style="font-size:.75rem;" data-agmfetch="${crop.id}">${L('retry','पुनः प्रयास')}</button></div>`;
  return `<div class="agm-badge"><button class="linklike" style="font-size:.78rem;" data-agmfetch="${crop.id}">${L("Check today's live AGMARKNET price",'आज की लाइव AGMARKNET कीमत देखें')}</button></div>`;
}
function agmarknetPanel(cropId, applyToInputId, selectId){
  const crop = CROPS.find(c=>c.id===cropId) || CROPS[0];
  const st = S.agmarknetStatus[crop.id];
  const cached = S.agmarknetCache[crop.id];
  const srcAttr = selectId ? ` data-agmselectsrc="${selectId}"` : '';
  let body;
  if (st==='loading'){
    body = `<p class="small-note">⏳ ${L(`Checking AGMARKNET for ${crop.name}…`,`${crop.name} के लिए AGMARKNET जांचा जा रहा है…`)}</p>`;
  } else if (st==='live' && cached){
    const perKg = cached.modal/100;
    body = `<p class="small-note">🟢 <b>${L('Live','लाइव')}</b> — ${L(`modal price ₹${cached.modal}/quintal (${inr(perKg.toFixed(2))}/kg) at ${esc(cached.market||'a nearby mandi')}, ${esc(cached.district||'')} · arrival ${esc(cached.arrivalDate||'today')}.`, `मोडल कीमत ₹${cached.modal}/क्विंटल (${inr(perKg.toFixed(2))}/किलो), ${esc(cached.market||'नज़दीकी मंडी')}, ${esc(cached.district||'')} · आगमन ${esc(cached.arrivalDate||'आज')}।`)}</p>
      ${applyToInputId ? `<button class="btn btn-ghost btn-sm" style="margin-top:6px;" data-agmapply="${crop.id}" data-agmtarget="${applyToInputId}">${L('Use this price','यह कीमत उपयोग करें')}</button>` : ''}
      <button class="linklike" style="font-size:.78rem;margin-left:10px;" data-agmfetch="${crop.id}"${srcAttr}>${L('Refresh','रीफ़्रेश')}</button>`;
  } else if (st==='fallback'){
    body = `<p class="small-note">🟡 ${L(`Live AGMARKNET fetch didn't return data (no internet, the shared demo key is rate-limited, or no record for today) — showing the demo reference price of ₹${crop.modal}/quintal instead.`, `लाइव AGMARKNET डेटा नहीं मिला (इंटरनेट नहीं, शेयर्ड डेमो कुंजी सीमित है, या आज का कोई रिकॉर्ड नहीं) — इसके बजाय ₹${crop.modal}/क्विंटल का डेमो संदर्भ मूल्य दिखाया जा रहा है।`)} <button class="linklike" style="font-size:.78rem;" data-agmfetch="${crop.id}"${srcAttr}>${L('Try again','दोबारा प्रयास करें')}</button></p>`;
  } else {
    body = `<p class="small-note">${L(`Pull today's real mandi price for ${crop.name} from the Government of India's open-data AGMARKNET feed.`, `भारत सरकार के ओपन-डेटा AGMARKNET फ़ीड से ${crop.name} की आज की वास्तविक मंडी कीमत प्राप्त करें।`)}</p>
      <button class="btn btn-ghost btn-sm" data-agmfetch="${crop.id}"${srcAttr}>${L('Check live AGMARKNET price','लाइव AGMARKNET कीमत देखें')}</button>`;
  }

/* ---------- Pricing model (from ELysian business-model design) ----------
   Consumer price = farmer procurement + quality/handling + aggregation/
   warehouse + logistics/delivery + technology/payment/manpower + company
   margin (+ optional expedited-logistics charge for early/bulk delivery) */
const PRICE_FACTORS = {
  qualityHandling: 0.06,
  aggregationWarehouse: 0.05,
  logisticsDelivery: 0.09,
  techPaymentManpower: 0.04,
  companyMargin: 0.08,
  expedited: 0.03,
};
function calcBreakdown(farmerPricePerKg, expedited){
  const f = farmerPricePerKg;
  const rows = [
    { label:'Farmer procurement (AGMARKNET base)', labelHi:'किसान खरीद (AGMARKNET आधार)', key:'farmer', value: f, color:'#357f49' },
    { label:'Quality & handling', labelHi:'गुणवत्ता व हैंडलिंग', key:'qh', value: f*PRICE_FACTORS.qualityHandling, color:'#7fae60' },
    { label:'Aggregation & warehouse', labelHi:'एकत्रीकरण व वेयरहाउस', key:'aw', value: f*PRICE_FACTORS.aggregationWarehouse, color:'#e2a33d' },
    { label:'Logistics & delivery', labelHi:'लॉजिस्टिक्स व डिलीवरी', key:'ld', value: f*PRICE_FACTORS.logisticsDelivery, color:'#a6522f' },
    { label:'Technology, payments & manpower', labelHi:'तकनीक, भुगतान व मानव संसाधन', key:'tp', value: f*PRICE_FACTORS.techPaymentManpower, color:'#6b7fb0' },
    { label:'Company margin', labelHi:'कंपनी मार्जिन', key:'cm', value: f*PRICE_FACTORS.companyMargin, color:'#16301f' },
  ];
  if (expedited) rows.push({ label:'Expedited / bulk logistics', labelHi:'शीघ्र / थोक लॉजिस्टिक्स', key:'ex', value: f*PRICE_FACTORS.expedited, color:'#b23b3b' });
  const total = rows.reduce((s,r)=>s+r.value,0);
  return { rows, total };
}
function inr(n){ return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2}); }
function inr0(n){ return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:0}); }

/* ---------- Persistence (so an accidental refresh doesn't wipe a live demo) ---------- */
const PERSIST_KEY = 'smartforum_demo_state_v1';
function persistState(){
  try{
    const snapshot = {
      db: DB,
      users: USERS,
      ui: {
        role:S.role, theme:S.theme, language:S.language, farmerTab:S.farmerTab, consumerTab:S.consumerTab,
        logisticsTab:S.logisticsTab, assocTab:S.assocTab, routeMode:S.routeMode,
        areaFilter:S.areaFilter, selectedCrop:S.selectedCrop, chatMessages:S.chatMessages,
        logiStopIndex:S.logiStopIndex, routeConfirmed:S.routeConfirmed,
        agmarknetApiKey:S.agmarknetApiKey,
        currentUser: S.currentUser ? { role:S.currentUser.role, identifier:S.currentUser.identifier } : null,
        activeOrderId: S.activeOrder ? S.activeOrder.id : null,
      }
    };
    localStorage.setItem(PERSIST_KEY, JSON.stringify(snapshot));
  }catch(e){ /* storage unavailable or full — demo still works, just won't survive a refresh */ }
}
function loadPersistedState(){
  try{
    const raw = localStorage.getItem(PERSIST_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved || !saved.db || !saved.users) return;
    Object.keys(saved.db).forEach(k=>{ if (k in DB) DB[k] = saved.db[k]; });
    USERS.length = 0; saved.users.forEach(u=>USERS.push(u));
    const ui = saved.ui || {};
    Object.assign(S, {
      theme: ui.theme || S.theme, language: ui.language || S.language, farmerTab: ui.farmerTab || S.farmerTab,
      consumerTab: ui.consumerTab || S.consumerTab, logisticsTab: ui.logisticsTab || S.logisticsTab,
      assocTab: ui.assocTab || S.assocTab, routeMode: ui.routeMode || S.routeMode,
      areaFilter: ui.areaFilter || S.areaFilter, selectedCrop: ui.selectedCrop || S.selectedCrop,
      chatMessages: ui.chatMessages || S.chatMessages,
      logiStopIndex: ui.logiStopIndex!=null ? ui.logiStopIndex : S.logiStopIndex,
      routeConfirmed: ui.routeConfirmed || null,
      agmarknetApiKey: ui.agmarknetApiKey || null,
    });
    if (ui.currentUser){
      const u = USERS.find(x=>x.role===ui.currentUser.role && x.identifier===ui.currentUser.identifier);
      if (u){ S.currentUser = u; S.role = ui.role || u.role; }
    }
    if (ui.activeOrderId){
      const o = DB.orders.find(x=>x.id===ui.activeOrderId);
      if (o) S.activeOrder = o;
    }
  }catch(e){ /* corrupted/unavailable storage — fall back to fresh demo data */ }
}
function resetDemoData(){
  try{ localStorage.removeItem(PERSIST_KEY); }catch(e){}
  location.reload();
}

const PROTECTED_ROLES = ['farmer','consumer','logistics','associate'];
function render(){
  const app = document.getElementById('app');
  let main;
  if (S.role==='home') main = homePage();
  else if (S.role==='auth') main = authPage();
  else if (PROTECTED_ROLES.includes(S.role)){
    if (S.currentUser && S.currentUser.role===S.role) main = dashPage();
    else if (S.currentUser) main = accessDeniedPage();
    else { S.authRole = S.role; S.authView = 'login'; main = authPage(); }
  } else main = homePage();
  document.documentElement.setAttribute('data-theme', S.theme);
  const toastHtml = S._toast ? `<div class="toast" role="status">${esc(S._toast)}</div>` : '';
  app.innerHTML = topNav() + main + (S.modal ? modalHtml(S.modal) : '') + cookieBar() + chatWidget() + toastHtml;
  bindEvents();
  // Only reset scroll position on genuine navigation (role/tab/auth-view changes) —
  // not on every state mutation (adding a listing, sending a chat message, etc.)
  const navKey = [S.role, S.farmerTab, S.consumerTab, S.logisticsTab, S.assocTab, S.authView].join('|');
  if (navKey !== S._navKey){ window.scrollTo({top:0}); S._navKey = navKey; }
  persistState();
}
function showToast(msg){
  S._toast = msg;
  clearTimeout(S._toastTimer);
  render();
  S._toastTimer = setTimeout(()=>{ S._toast = null; render(); }, 2600);
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function goToRole(role){
  if (S.currentUser && S.currentUser.role===role){ S.role = role; }
  else { S.role = role; }
  render();
}

  return `

function fmtCheckpointTime(d){
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h = d.getHours(); const m = d.getMinutes();
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h%12; if (h===0) h = 12;
  const mm = m<10 ? '0'+m : ''+m;
  return `${d.getDate()} ${months[d.getMonth()]} · ${h}:${mm} ${ampm}`;
}
function trackingTimelineHtml(checkpoints){
  return `<div class="track-timeline">${checkpoints.map(c=>`
    <div class="tl-item ${c.state}">
      <div class="tl-time">${c.state==='upcoming' ? L('Expected · ','अपेक्षित · ') : ''}${c.time}</div>
      <div class="tl-title">${c.title}</div>
      ${c.desc ? `<div class="tl-desc">${c.desc}</div>` : ''}
    </div>`).join('')}</div>`;
}

function orderStatusIndex(order){
  const i = ORDER_STAGES.findIndex(s=>s.key===order.status);
  return i>=0 ? i : (order.status==='Delivered' ? ORDER_STAGES.length-1 : ORDER_STAGES.length-2);
}
function orderCheckpoints(order){
  const idx = orderStatusIndex(order);
  const base = new Date((order.placed||'2026-01-01')+'T08:00:00');
  return ORDER_STAGES.map((s,i)=>{
    const t = new Date(base.getTime() + s.hOffset*3600*1000);
    const state = i<idx ? 'done' : (i===idx ? 'current' : 'upcoming');
    return { time: fmtCheckpointTime(t), title:L(s.title,s.titleHi), desc:L(s.desc,s.descHi), state };
  });
}

  const listings = DB.marketplace;
  if (!listings.length) return null;
  // Rank live listings the way the pitch describes: quality grade first, then batch size.
  const ranked = [...listings].sort((a,b)=> a.grade!==b.grade ? a.grade.localeCompare(b.grade) : b.qty-a.qty);
  const top = ranked[0];
  const crop = CROPS.find(c=>c.name===top.crop) || CROPS[0];
  const live = S.agmarknetCache[crop.id];
  const isLive = S.agmarknetStatus[crop.id]==='live' && live;
  const basePerKg = isLive ? live.modal/100 : crop.modal/100;
  const bd = calcBreakdown(basePerKg, false);
  const marginRow = bd.rows.find(r=>r.key==='cm');
  const margin = (marginRow ? marginRow.value : 0) * top.qty;
  const passes = top.price >= basePerKg * 0.85; // flags listings priced well below the AGMARKNET fair-price floor
  const routeLabel = ({fastest:'Fastest', safest:'Safest', cost:'Cost-effective'})[S.routeMode] || 'Fastest';
  const demandLevel = top.qty>=300 ? 'High' : (top.qty>=120 ? 'Moderate' : 'Low');
  return { top, rankedCount: ranked.length, margin, passes, routeLabel, demandLevel, basePerKg, cropId: crop.id, isLive };
}

function statusClass(s){
  if (['Listed','On route','Out for delivery','Dispatched'].includes(s)) return 'info';
  if (['Delivered','Paid','Aggregated','Scheduled'].includes(s)) return 'ok';
  if (['Pending QC','Pending','Open'].includes(s)) return 'pending';
  return 'info';
}

function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{ S.role = el.dataset.nav; render(); }));

  // Auth: open login/register from nav
  document.querySelectorAll('[data-authopen]').forEach(el=>el.addEventListener('click', ()=>{
    S.role='auth'; S.authView = el.dataset.authopen; S.authError=''; render();
  }));
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', ()=>{ S.currentUser=null; S.role='home'; render(); });
  const deniedLogout = document.getElementById('deniedLogout');
  if (deniedLogout) deniedLogout.addEventListener('click', ()=>{ S.currentUser=null; S.authError=''; render(); });

  // Auth: tabs / role pills
  document.querySelectorAll('[data-authtab]').forEach(el=>el.addEventListener('click', ()=>{ S.authView = el.dataset.authtab; S.authError=''; render(); }));
  document.querySelectorAll('[data-authrole]').forEach(el=>el.addEventListener('click', ()=>{ S.authRole = el.dataset.authrole; S.authError=''; render(); }));

  // Auth: login
  const loginSubmit = document.getElementById('loginSubmit');
  if (loginSubmit) loginSubmit.addEventListener('click', ()=>{
    const idVal = (document.getElementById('loginIdentifier').value||'').trim();
    const pwVal = document.getElementById('loginPassword').value||'';
    const match = USERS.find(u=>u.role===S.authRole && u.identifier.toLowerCase()===idVal.toLowerCase() && u.password===pwVal);
    if (!match){ S.authError = 'No matching account found. Check your details, or try the demo account below.'; render(); return; }
    S.currentUser = match; S.role = match.role; S.authError=''; render();
  });
  const fillDemo = document.getElementById('fillDemo');
  if (fillDemo) fillDemo.addEventListener('click', (e)=>{
    e.preventDefault();
    const demo = USERS.find(u=>u.role===S.authRole);
    document.getElementById('loginIdentifier').value = demo.identifier;
    document.getElementById('loginPassword').value = demo.password;
  });

  // Auth: register
  const registerSubmit = document.getElementById('registerSubmit');
  if (registerSubmit) registerSubmit.addEventListener('click', ()=>{
    const role = S.authRole;
    const profile = {};
    document.querySelectorAll('#registerFields [data-field]').forEach(inp=>{
      const key = inp.dataset.field, val = inp.value.trim();
      profile[key] = key==='password' ? val : esc(val);
    });
    if (!profile.name || !profile.identifier || !profile.password){
      S.authError = 'Please fill in your name, email/phone and a password.'; render(); return;
    }
    if (USERS.some(u=>u.role===role && u.identifier.toLowerCase()===profile.identifier.toLowerCase())){
      S.authError = 'An account with these details already exists — try logging in instead.'; render(); return;
    }
    const newUser = { role, identifier: profile.identifier, password: profile.password, profile };
    USERS.push(newUser);
    S.currentUser = newUser; S.role = role; S.authError=''; render();
  });
  document.querySelectorAll('[data-scroll]').forEach(el=>el.addEventListener('click', ()=>{
    S.role='home'; render(); setTimeout(()=>{ const t=document.getElementById(el.dataset.scroll); if(t) t.scrollIntoView({behavior:'smooth'}); }, 30);
  }));
  document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click', ()=>{ S.modal = el.dataset.modal; render(); }));
  const overlay = document.getElementById('modalOverlay');
  if (overlay){
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ S.modal=null; render(); }});
    const mc = document.getElementById('modalClose'); if(mc) mc.addEventListener('click', ()=>{ S.modal=null; render(); });
  }
  const cookieBtn = document.getElementById('cookieAccept');
  if (cookieBtn) cookieBtn.addEventListener('click', ()=>{ S._cookieDismissed = true; render(); });

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  if (themeToggle) themeToggle.addEventListener('click', ()=>{ S.theme = S.theme==='dark' ? 'light' : 'dark'; render(); });
  const langSwitchBtn = document.getElementById('langSwitchBtn');
  if (langSwitchBtn) langSwitchBtn.addEventListener('click', (e)=>{ e.stopPropagation(); S.langMenuOpen = !S.langMenuOpen; render(); });
  document.querySelectorAll('[data-setlang]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    S.language = el.dataset.setlang; S.langMenuOpen = false; render();
  }));
  if (S.langMenuOpen){
    document.addEventListener('click', ()=>{ S.langMenuOpen = false; render(); }, { once:true });
  }

  // Marketplace nav (consumers only — reuses the existing role auth-gate)
  const marketplaceNav = document.getElementById('marketplaceNav');
  if (marketplaceNav) marketplaceNav.addEventListener('click', ()=>{
    S.consumerTab = 'market';
    S.role = 'consumer';
    render();
  });

  // Generic remove-item system (farmer / consumer / logistics / associate dashboards)
  document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click', ()=>{
    const path = el.dataset.remove.split('.');
    const idx = Number(el.dataset.idx);
    let arr = DB;
    for (let i=0; i<path.length; i++) arr = arr[path[i]];
    arr.splice(idx,1);
    render();
  }));

  // Marketplace: farmer posts a listing
  const addMarketBtn = document.getElementById('addMarketBtn');
  if (addMarketBtn) addMarketBtn.addEventListener('click', ()=>{
    const crop = document.getElementById('mkCropSelect').value;
    const qty = Number(document.getElementById('mkQty').value) || 100;
    const price = Number(document.getElementById('mkPrice').value) || 25;
    const grade = document.getElementById('mkGrade').value;
    const desc = esc(document.getElementById('mkDesc').value || 'Fresh produce, ready for pickup.');
    DB.marketplace.unshift({ id:'MK-'+Math.floor(Math.random()*9000+1000), farmer:S.currentUser.profile.name, crop, qty, unit:'kg', price, grade, desc });
    S.mkPriceOverride = null;
    S.farmerTab = 'market'; render();
  });

  // Marketplace: consumer buys a listing
  document.querySelectorAll('[data-buy]').forEach(el=>el.addEventListener('click', ()=>{
    const i = Number(el.dataset.buy);
    const m = DB.marketplace[i];
    if (!m) return;
    const newOrder = { id:'SF-'+Math.floor(Math.random()*90000+10000), items:`${m.crop} ${m.qty>5?5:m.qty}kg`, placed:new Date().toISOString().slice(0,10), status:'Order placed', eta:'Pending dispatch', total: m.price * (m.qty>5?5:m.qty) };
    DB.orders.unshift(newOrder);
    S.activeOrder = newOrder;
    DB.marketplace.splice(i,1);
    S.consumerTab = 'orders'; render();
  }));

  // AI chatbot
  const chatFab = document.getElementById('chatFab');
  if (chatFab) chatFab.addEventListener('click', ()=>{ S.chatOpen = !S.chatOpen; render(); });
  const chatClose = document.getElementById('chatClose');
  if (chatClose) chatClose.addEventListener('click', ()=>{ S.chatOpen = false; render(); });
  function sendChat(text){
    const t = (text||'').trim();
    if (!t) return;
    S.chatMessages.push({ from:'user', text:esc(t) });
    S.chatMessages.push({ from:'bot', text: botReply(t) });
    render();
    setTimeout(()=>{ const body=document.getElementById('chatBody'); if(body) body.scrollTop = body.scrollHeight; }, 0);
  }
  const chatSend = document.getElementById('chatSend');
  if (chatSend) chatSend.addEventListener('click', ()=>{ sendChat(document.getElementById('chatInput').value); });
  const chatInput = document.getElementById('chatInput');
  if (chatInput){
    chatInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter'){ sendChat(chatInput.value); } });
    chatInput.focus();
  }
  document.querySelectorAll('[data-chatquick]').forEach(el=>el.addEventListener('click', ()=>{ sendChat(el.dataset.chatquick); }));
  const chatBodyEl = document.getElementById('chatBody');
  if (chatBodyEl) chatBodyEl.scrollTop = chatBodyEl.scrollHeight;

  const areaSelect = document.getElementById('areaSelect');
  if (areaSelect) areaSelect.addEventListener('change', (e)=>{ S.areaFilter = e.target.value; render(); });

  // Farmer
  document.querySelectorAll('[data-farmertab]').forEach(el=>el.addEventListener('click', ()=>{ S.farmerTab = el.dataset.farmertab; render(); }));
  const addProduceBtn = document.getElementById('addProduceBtn');
  if (addProduceBtn) addProduceBtn.addEventListener('click', ()=>{
    const crop = document.getElementById('newCropSelect').value;
    const qty = document.getElementById('newQty').value || '100';
    const grade = document.getElementById('newGrade').value;
    const harvest = document.getElementById('newHarvest').value || new Date().toISOString().slice(0,10);
    DB.produces.unshift({ crop, qty:Number(qty), unit:'kg', grade, harvest, status:'Listed' });
    render(); S.farmerTab='produces';
  });
  const stockCropSelect = document.getElementById('stockCropSelect');
  if (stockCropSelect) stockCropSelect.addEventListener('change',(e)=>{ S.selectedCrop = e.target.value; render(); });

  // Consumer
  document.querySelectorAll('[data-consumertab]').forEach(el=>el.addEventListener('click', ()=>{ S.consumerTab = el.dataset.consumertab; render(); }));
  const trackOrderSelect = document.getElementById('trackOrderSelect');
  if (trackOrderSelect) trackOrderSelect.addEventListener('change',(e)=>{ S.activeOrder = DB.orders.find(o=>o.id===e.target.value); render(); });
  const advanceTrackBtn = document.getElementById('advanceTrackBtn');
  if (advanceTrackBtn) advanceTrackBtn.addEventListener('click', ()=>{
    const idx = orderStatusIndex(S.activeOrder);
    if (idx < ORDER_STAGES.length-1){ S.activeOrder.status = ORDER_STAGES[idx+1].key; }
    render();
  });
  const fbSubmit = document.getElementById('fbSubmit');
  if (fbSubmit) fbSubmit.addEventListener('click', ()=>{
    const order = document.getElementById('fbOrder').value;
    const rating = Number(document.getElementById('fbRating').value);
    const text = esc(document.getElementById('fbText').value || '(no comment)');
    DB.feedback.unshift({ order, rating, text });
    S.consumerTab='feedback'; render();
  });

  // Profile "Save changes" buttons — Farmer, Consumer, Logistics, Associate
  const farmerSaveBtn = document.getElementById('farmerSaveBtn');
  if (farmerSaveBtn) farmerSaveBtn.addEventListener('click', ()=>{
    const p = S.currentUser.profile;
    p.name = esc(document.getElementById('fdName').value.trim()) || p.name;
    p.phone = esc(document.getElementById('fdPhone').value.trim());
    p.village = esc(document.getElementById('fdVillage').value.trim());
    p.district = esc(document.getElementById('fdDistrict').value.trim());
    p.state = esc(document.getElementById('fdState').value.trim());
    p.land = esc(document.getElementById('fdLand').value.trim());
    p.crops = esc(document.getElementById('fdCrops').value.trim());
    p.bank = esc(document.getElementById('fdBank').value.trim());
    showToast(L('Profile updated','प्रोफ़ाइल अपडेट हुई'));
  });
  const consumerSaveBtn = document.getElementById('consumerSaveBtn');
  if (consumerSaveBtn) consumerSaveBtn.addEventListener('click', ()=>{
    const p = S.currentUser.profile;
    p.name = esc(document.getElementById('cdName').value.trim()) || p.name;
    p.phone = esc(document.getElementById('cdPhone').value.trim());
    p.address = esc(document.getElementById('cdAddress').value.trim());
    p.preferred = esc(document.getElementById('cdPreferred').value.trim());
    showToast(L('Profile updated','प्रोफ़ाइल अपडेट हुई'));
  });

  // Farmer services — Request buttons create a real request the Associate team can see and action
  document.querySelectorAll('[data-farmreqtype]').forEach(el=>el.addEventListener('click', ()=>{
    const type = el.dataset.farmreqtype;
    DB.farmServiceRequests.unshift({ request:'FS-'+Math.floor(Math.random()*9000+1000), farmer:S.currentUser.profile.name, type, status:'Pending' });
    showToast(L(`Request sent — ${type}`, `अनुरोध भेजा गया — ${type}`));
  }));
  // Any "open chat" CTA (e.g. Consumer services → Customer support chat)
  document.querySelectorAll('[data-openchat]').forEach(el=>el.addEventListener('click', ()=>{ S.chatOpen = true; S.modal = null; render(); }));

  // Live AGMARKNET price checks
  document.querySelectorAll('[data-agmfetch]').forEach(el=>el.addEventListener('click', ()=>{
    let cropId = el.dataset.agmfetch;
    const selId = el.dataset.agmselectsrc;
    if (selId){
      const sel = document.getElementById(selId);
      if (sel){
        const opt = sel.selectedOptions && sel.selectedOptions[0];
        cropId = (opt && opt.dataset.cropid) || sel.value || cropId;
      }
      S.agmarknetLastFarmerCrop = cropId;
    }
    fetchAgmarknetPrice(cropId);
  }));
  document.querySelectorAll('[data-agmapply]').forEach(el=>el.addEventListener('click', ()=>{
    const cropId = el.dataset.agmapply, targetId = el.dataset.agmtarget;
    const cached = S.agmarknetCache[cropId];
    if (cached){
      if (targetId==='mkPrice') S.mkPriceOverride = (cached.modal/100).toFixed(2);
      const target = document.getElementById(targetId);
      if (target) target.value = (cached.modal/100).toFixed(2);
      showToast(L('Live AGMARKNET price applied','लाइव AGMARKNET कीमत लागू की गई'));
    }
  }));
  document.querySelectorAll('[data-agmsavekey]').forEach(el=>el.addEventListener('click', ()=>{
    const cropId = el.dataset.agmsavekey;
    const input = document.getElementById('agmApiKey_'+cropId);
    const val = input ? input.value.trim() : '';
    S.agmarknetApiKey = val || null;
    delete S.agmarknetCache[cropId]; S.agmarknetStatus[cropId] = null;
    showToast(val ? 'Personal API key saved' : 'Reverted to the shared demo key');
  }));

  // Logistics
  document.querySelectorAll('[data-logitab]').forEach(el=>el.addEventListener('click', ()=>{ S.logisticsTab = el.dataset.logitab; render(); }));
  document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click', ()=>{ S.routeConfirmed = null; S.routeMode = el.dataset.route; render(); }));
  const logiAdvanceBtn = document.getElementById('logiAdvanceBtn');
  if (logiAdvanceBtn) logiAdvanceBtn.addEventListener('click', ()=>{
    if (S.logiStopIndex < LOGI_STOPS.length-1) S.logiStopIndex++;
    showToast(L(`Location updated — ${LOGI_STOPS[S.logiStopIndex].name}`, `लोकेशन अपडेट हुई — ${L(LOGI_STOPS[S.logiStopIndex].name,LOGI_STOPS[S.logiStopIndex].nameHi)}`));
  });
  const logiSaveBtn = document.getElementById('logiSaveBtn');
  if (logiSaveBtn) logiSaveBtn.addEventListener('click', ()=>{
    const p = S.currentUser.profile;
    p.name = esc(document.getElementById('ldName').value.trim()) || p.name;
    p.contact = esc(document.getElementById('ldContact').value.trim());
    p.phone = esc(document.getElementById('ldPhone').value.trim());
    p.vehicles = Number(document.getElementById('ldVehicles').value) || 0;
    p.area = esc(document.getElementById('ldArea').value.trim());
    showToast(L('Profile updated','प्रोफ़ाइल अपडेट हुई'));
  });
  const confirmRouteBtn = document.getElementById('confirmRouteBtn');
  if (confirmRouteBtn) confirmRouteBtn.addEventListener('click', ()=>{
    S.routeConfirmed = S.routeMode;
    showToast(L('Route confirmed','मार्ग की पुष्टि हुई'));
  });
  document.querySelectorAll('[data-raiseissue]').forEach(el=>el.addEventListener('click', ()=>{
    showToast(L(`Issue raised with ${el.dataset.raiseissue} — they'll be in touch shortly.`, `${el.dataset.raiseissue} के साथ शिकायत दर्ज की गई — वे जल्द संपर्क करेंगे।`));
  }));

  // Associate
  document.querySelectorAll('[data-assoctab]').forEach(el=>el.addEventListener('click', ()=>{ S.assocTab = el.dataset.assoctab; render(); }));
  document.querySelectorAll('[data-qcpass]').forEach(el=>el.addEventListener('click', ()=>{
    DB.qcQueue[Number(el.dataset.qcpass)].grade = 'A'; S.assocTab='quality'; render();
  }));
  const associateSaveBtn = document.getElementById('associateSaveBtn');
  if (associateSaveBtn) associateSaveBtn.addEventListener('click', ()=>{
    const p = S.currentUser.profile;
    p.name = esc(document.getElementById('adName').value.trim()) || p.name;
    p.role = esc(document.getElementById('adRole').value.trim());
    p.hub = esc(document.getElementById('adHub').value.trim());
    p.id = esc(document.getElementById('adId').value.trim());
    showToast(L('Profile updated','प्रोफ़ाइल अपडेट हुई'));
  });
  const calcRunBtn = document.getElementById('calcRunBtn');
  if (calcRunBtn) calcRunBtn.addEventListener('click', ()=>{
    const qty = Number(document.getElementById('calcQty').value)||0;
    const days = Number(document.getElementById('calcDays').value)||0;
    const cost = qty*days*42;
    document.getElementById('calcResult').textContent = `Estimated cold-storage cost: ${inr0(cost)} for ${qty} tonnes over ${days} days (₹42/tonne/day).`;
  });

  const resetDemoBtn = document.getElementById('resetDemoBtn');
  if (resetDemoBtn) resetDemoBtn.addEventListener('click', ()=>{
    if (confirm(L('This clears any accounts, listings and orders created in this demo session and reloads fresh sample data. Continue?','यह इस डेमो सत्र में बनाए गए किसी भी खाते, लिस्टिंग और ऑर्डर को हटा देगा और नया नमूना डेटा लोड करेगा। जारी रखें?'))) resetDemoData();
  });

  animateCounters();
}

function animateCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = Number(el.dataset.count);
    const prefix = el.dataset.prefix || '';
    const suffix = el.dataset.suffix || '';
    let cur = 0;
    const step = Math.max(1, Math.round(target/60));
    const timer = setInterval(()=>{
      cur += step;
      if (cur >= target){ cur = target; clearInterval(timer); }
      el.textContent = prefix + cur.toLocaleString('en-IN') + suffix;
    }, 16);
  });
}

loadPersistedState();
render();
</script>
</body>
</html>
